services:
  - type: web
    name: hermes-pro-api
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: HOTMART_CLIENT_ID
        sync: false
      - key: HOTMART_CLIENT_SECRET
        sync: false
      - key: HOTMART_WEBHOOK_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PUBLIC_API_URL
        value: https://hermes-pro-api-commercial.onrender.com
      - key: OAUTH_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_TRENDS_GEO
        value: BR
      - key: GOOGLE_TRENDS_ENABLED
        value: "true"
      - key: CANVA_CLIENT_ID
        sync: false
      - key: CANVA_CLIENT_SECRET
        sync: false

  - type: worker
    name: hermes-pro-worker
    runtime: python
    buildCommand: pip install .
    startCommand: python -m worker.main
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OAUTH_ENCRYPTION_KEY
        sync: false
      - key: CANVA_CLIENT_ID
        sync: false
      - key: CANVA_CLIENT_SECRET
        sync: false

  - type: cron
    name: hermes-pro-radar
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install .
    startCommand: python -m worker.radar_cron
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_TRENDS_GEO
        value: BR
      - key: GOOGLE_TRENDS_ENABLED
        value: "true"
