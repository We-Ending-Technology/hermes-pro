services:
  - type: web
    name: hermes-pro-api
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FREELANCER_CLIENT_ID
        sync: false
      - key: FREELANCER_CLIENT_SECRET
        sync: false
      - key: FREELANCER_ACCESS_TOKEN
        sync: false
      - key: RADAR_SOURCE_URLS
        sync: false
      - key: RADAR_MIN_SCORE
        value: "65"
      - key: AUTO_APPLY_ENABLED
        value: "false"
      - key: MAX_APPLICATIONS_PER_DAY
        value: "5"
      - key: CANVA_CLIENT_ID
        sync: false
      - key: CANVA_CLIENT_SECRET
        sync: false
      - key: UPWORK_CLIENT_ID
        sync: false
      - key: UPWORK_CLIENT_SECRET
        sync: false
      - key: UPWORK_ACCESS_TOKEN
        sync: false
      - key: PIPPIT_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false

  - type: worker
    name: hermes-pro-worker
    runtime: python
    buildCommand: pip install .
    startCommand: python -m worker.main
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RADAR_SOURCE_URLS
        sync: false

  - type: cron
    name: hermes-pro-radar
    runtime: python
    schedule: "0 12 * * *"
    buildCommand: pip install .
    startCommand: python -c "import asyncio; from backend.app.core.config import get_settings; from backend.app.db.supabase import SupabaseREST; from backend.app.services.opportunity_engine import OpportunityEngine; s=get_settings(); asyncio.run(OpportunityEngine(SupabaseREST(s),s).run(1000))"
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RADAR_SOURCE_URLS
        sync: false
