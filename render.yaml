services:
  - type: web
    name: hermes-pro-api-commercial
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install .
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: AI_FALLBACK_PROVIDER
        value: none
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-6-luna
      - key: OPENAI_AGENT_MODEL
        value: gpt-6-astra
      - key: AUTONOMY_ENABLED
        value: "true"
      - key: EMBEDDED_WORKER_ENABLED
        value: "true"
      - key: AUTONOMY_INTERVAL_SECONDS
        value: "900"
      - key: AUTONOMY_MAX_DAILY_PRODUCTS
        value: "1"
      - key: AUTONOMY_MAX_ACTIVE_PRODUCTS
        value: "1"
      - key: AUTONOMY_MAX_READY_TO_PUBLISH
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: HERMES_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: HOTMART_CLIENT_ID
        sync: false
      - key: HOTMART_CLIENT_SECRET
        sync: false
      - key: HOTMART_WEBHOOK_TOKEN
        sync: false
      - key: KIWIFY_WEBHOOK_TOKEN
        sync: false
      - key: KIWIFY_API_CLIENT_ID
        sync: false
      - key: KIWIFY_API_CLIENT_SECRET
        sync: false
      - key: KIWIFY_ACCOUNT_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
