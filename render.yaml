databases:
  - name: hermes-pro-db
    databaseName: hermes_pro_db
    user: hermes_pro_db_user
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    diskSizeGB: 1

services:
  - type: web
    name: hermes-pro-api-virginia
    runtime: python
    region: virginia
    buildCommand: pip install .
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: HERMES_API_TOKEN
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: HERMES_API_TOKEN
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: GEMINI_API_KEY
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: OPENAI_API_KEY
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_AGENT_MODEL
        value: gpt-6-astra
      - key: DATABASE_URL
        fromDatabase:
          name: hermes-pro-db
          property: connectionString
      - key: SUPABASE_URL
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SECRET_KEY
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: SUPABASE_SECRET_KEY
      - key: REDIS_URL
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: REDIS_URL
      - key: CORS_ORIGINS
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: CORS_ORIGINS
      - key: HOTMART_CLIENT_ID
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: HOTMART_CLIENT_ID
      - key: HOTMART_CLIENT_SECRET
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: HOTMART_CLIENT_SECRET
      - key: HOTMART_WEBHOOK_TOKEN
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: HOTMART_WEBHOOK_TOKEN
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_CHAT_ID
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: TELEGRAM_CHAT_ID
      - key: FREELANCER_ACCESS_TOKEN
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: FREELANCER_ACCESS_TOKEN
      - key: FREELANCER_SANDBOX
        value: "true"
      - key: FREELANCER_ENABLED
        value: "false"
      - key: FREELANCER_AUTO_APPLY
        value: "false"
      - key: FREELANCER_BIDDER_ID
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: FREELANCER_BIDDER_ID
      - key: FREELANCER_PROFILE_ID
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: FREELANCER_PROFILE_ID
      - key: CANVA_CLIENT_ID
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: CANVA_CLIENT_ID
      - key: CANVA_CLIENT_SECRET
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: CANVA_CLIENT_SECRET
      - key: CANVA_REDIRECT_URI
        fromService:
          name: hermes-pro-api-commercial
          type: web
          envVarKey: CANVA_REDIRECT_URI
      - key: AUTONOMY_ENABLED
        value: "true"
      - key: AUTONOMY_MIN_SCORE
        value: "55"
