services:
  - type: web
    name: hermes-pro-api
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FREELANCER_CLIENT_ID
        sync: false
      - key: FREELANCER_CLIENT_SECRET
        sync: false
      - key: FREELANCER_ACCESS_TOKEN
        sync: false
      - key: RADAR_SOURCE_URLS
        sync: false
  - type: worker
    name: hermes-pro-worker
    runtime: python
    buildCommand: pip install .
    startCommand: python -m worker.main
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RADAR_SOURCE_URLS
        sync: false
  - type: cron
    name: hermes-pro-radar
    runtime: python
    schedule: "0 12 * * *"
    buildCommand: pip install .
    startCommand: python -c "import httpx; httpx.post('https://hermes-pro-api-commercial.onrender.com/api/v1/radar/run?limit=1000', timeout=120)"
    envVars:
      - key: APP_ENV
        value: production
