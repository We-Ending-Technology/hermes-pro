name: Keep Hermes API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake and verify Hermes API
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail --max-time 60 https://hermes-pro-api-commercial.onrender.com/health)"
          echo "$response"
