name: Hermes Autonomous Radar

on:
  # Keep the free Render API awake so its embedded worker can run the
  # autonomous scheduler. This uses no paid API or GitHub-hosted secret.
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

concurrency:
  group: hermes-autonomous-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-slim
    timeout-minutes: 4
    steps:
      - name: Wake Hermes API and embedded autonomous worker
        env:
          HERMES_API_URL: https://hermes-pro-api-commercial.onrender.com
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --location --max-time 180 \
            --output "$response_file" --write-out "%{http_code}" \
            "$HERMES_API_URL/health")"
          cat "$response_file"
          rm -f "$response_file"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Hermes health check returned HTTP $status"
            exit 1
          fi
          echo "Hermes API responded successfully; embedded worker starts its own autonomy loop."
