name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npm run build

  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package versioned Hermes source
        run: git archive --format=zip --output hermes-pro-source.zip HEAD
      - name: Package complete Git history and refs
        run: git bundle create hermes-pro-history.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-pro-backup-${{ github.sha }}
          path: |
            hermes-pro-source.zip
            hermes-pro-history.bundle
          retention-days: 90
