name: Hermes free autonomy keepalive

on:
  schedule:
    # Avoid the top of the hour; GitHub may delay scheduled jobs during peak load.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-free-keepalive
  cancel-in-progress: true

jobs:
  wake-api:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the free Render API and its embedded worker
        env:
          HERMES_HEALTH_URL: https://hermes-pro-api-commercial.onrender.com/health
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail --max-time 90 "$HERMES_HEALTH_URL")"
          echo "$response"
