name: Hermes API and database monitor

on:
  # Poll every 10 minutes; perform a real probe after the 150-minute target interval.
  # GitHub may delay scheduled starts, so the practical interval can drift slightly.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: hermes-2h30-monitor
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check whether 150 minutes have elapsed
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo, per_page: 100
            });
            const checkpoints = artifacts
              .filter(item => item.name.startsWith("hermes-monitor-checkpoint-") && !item.expired)
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            const latest = checkpoints[0];
            const elapsedMs = latest ? Date.now() - Date.parse(latest.created_at) : Number.POSITIVE_INFINITY;
            const intervalMs = 148 * 60 * 1000;
            const shouldRun = !latest || elapsedMs >= intervalMs;
            core.setOutput("should_run", shouldRun ? "true" : "false");
            if (latest) {
              core.info(`Last probe checkpoint: ${latest.created_at}; elapsed minutes: ${Math.floor(elapsedMs / 60000)}`);
            } else {
              core.info("No previous checkpoint; first probe will run.");
            }
            core.info(shouldRun ? "150-minute interval reached; running probe." : "Interval not reached; skipping this poll.");

      - name: Save monitoring checkpoint
        if: steps.gate.outputs.should_run == 'true'
        run: date -u +'%Y-%m-%dT%H:%M:%SZ' > hermes-monitor-checkpoint.txt

      - name: Persist checkpoint for the next scheduled run
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hermes-monitor-checkpoint-${{ github.run_id }}
          path: hermes-monitor-checkpoint.txt
          retention-days: 90
          if-no-files-found: error

      - name: Probe API and Supabase readiness
        id: probe
        if: steps.gate.outputs.should_run == 'true'
        env:
          HERMES_API_URL: https://hermes-pro-api-commercial.onrender.com
        shell: bash
        run: |
          set +e
          : > /tmp/hermes-readiness.json
          status=$(curl --silent --show-error --output /tmp/hermes-readiness.json --write-out '%{http_code}' \
            --connect-timeout 15 --max-time 40 --retry 2 --retry-delay 10 --retry-all-errors \
            "$HERMES_API_URL/ready")
          curl_exit=$?
          if [ "$curl_exit" -ne 0 ]; then
            status="000"
          fi
          body=$(cat /tmp/hermes-readiness.json)
          echo "http_status=$status" >> "$GITHUB_OUTPUT"
          echo "body=$body" >> "$GITHUB_OUTPUT"
          echo "Hermes readiness HTTP status: $status"
          echo "$body"
          if [ "$status" != "200" ]; then
            exit 1
          fi
          echo "$body" | jq -e '.status == "ready" and .checks.api == "ok" and .checks.database == "ok"'

      - name: Open one alert on failure, close it after recovery
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/github-script@v7
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          HTTP_STATUS: ${{ steps.probe.outputs.http_status }}
          PROBE_BODY: ${{ steps.probe.outputs.body }}
        with:
          script: |
            const title = "[Hermes Monitor] API ou banco indisponível";
            const { owner, repo } = context.repo;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100
            });
            const alert = openIssues.find(item => !item.pull_request && item.title === title);
            const failed = process.env.PROBE_OUTCOME !== "success";
            const status = process.env.HTTP_STATUS || "sem resposta";
            let details = process.env.PROBE_BODY || "A API não retornou conteúdo legível.";
            if (details.length > 4000) details = details.slice(0, 4000);

            if (failed && !alert) {
              await github.rest.issues.create({
                owner, repo, title,
                body: [
                  "O monitor externo detectou falha no Hermes.",
                  "",
                  `- Horário UTC: ${new Date().toISOString()}`,
                  `- HTTP: ${status}`,
                  `- Endpoint: https://hermes-pro-api-commercial.onrender.com/ready`,
                  "",
                  "Resposta:",
                  "```json",
                  details,
                  "```",
                  "",
                  "Este alerta será fechado automaticamente quando API e Supabase voltarem a responder."
                ].join("\n")
              });
            } else if (failed && alert) {
              core.notice(`Falha continua ativa; alerta existente #${alert.number} será mantido sem duplicação.`);
            } else if (!failed && alert) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: alert.number,
                body: `Hermes recuperado. API e Supabase responderam corretamente em ${new Date().toISOString()} UTC. Alerta encerrado automaticamente.`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: alert.number, state: "closed"
              });
            } else {
              core.info("Hermes saudável; nenhum alerta aberto.");
            }
